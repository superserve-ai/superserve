# Vendored slice of the sandbox repo's api/openapi.yaml — do not edit by hand.
#
# Contains only the /v1/qm/* operations and the components they reach.
# Refresh with:  bun run --cwd apps/console qm:openapi
# Then regenerate types with the same command; CI fails if either drifts.
openapi: 3.1.0
info:
  title: Superserve hosted QM API
  version: 0.0.0
  description: The /v1/qm/* slice of the Superserve API, served by qm-api.
paths:
  /v1/qm/slugs/{slug}/availability:
    get:
      operationId: checkQMSlugAvailability
      tags:
        - qm
      summary: Check whether a slug can be used for a new tenant
      description: |
        Answers across every team. A slug that fails the format rules or is reserved is reported unavailable with a reason rather than as an error, so the console can show it inline.
      security:
        - apiKey: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMSlugAvailability"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "500":
          $ref: "#/components/responses/QMInternalError"
  /v1/qm/tenants:
    get:
      operationId: listQMTenants
      tags:
        - qm
      summary: List the team's hosted QM tenants
      description: Returns every non-deleted tenant owned by the authenticated team, newest first.
      security:
        - apiKey: []
      responses:
        "200":
          description: Tenants owned by the team
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenants
                properties:
                  tenants:
                    type: array
                    items:
                      $ref: "#/components/schemas/QMTenant"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "500":
          $ref: "#/components/responses/QMInternalError"
    post:
      operationId: createQMTenant
      tags:
        - qm
      summary: Create a hosted QM tenant
      description: |
        Creates the tenant record and queues provisioning. The response is
        `202` with the tenant in status `provisioning`; poll
        `GET /v1/qm/tenants/{id}` for progress and events.

        One tenant per team for now: a second request answers `409`. The
        slug becomes the tenant's hostname under the QM base domain, so it
        must be a DNS label of 3–40 characters and not one of the reserved
        names (`www`, `api`, `admin`, `mail`, `qm`, `app`, `console`,
        `docs`, `status`).

        ## Model key handling

        `modelKey` is written straight to Secret Manager
        (`qm-<slug>-<PROVIDER>_API_KEY`) by this request and is never
        logged or stored in Postgres. The provisioner run is then started
        with only the tenant id: Cloud Run Job overrides are visible in
        execution metadata, so the key never travels through them. The key
        is checked for shape only here; whether the provider accepts it is
        verified during provisioning.

        Authorization follows the control plane's team roles: the key's
        holder needs `settings:write` here and `settings:read` for the
        read operations. The console's read-only impersonation key
        receives `403`.
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QMCreateTenantRequest"
      responses:
        "202":
          description: Tenant created; provisioning queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant
                properties:
                  tenant:
                    $ref: "#/components/schemas/QMTenant"
        "400":
          description: |
            The body is not a single JSON object, or one or more fields are invalid. Field-level problems carry a `fields` map.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMFieldError"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "403":
          $ref: "#/components/responses/QMForbidden"
        "409":
          description: |
            The team already has a tenant, the slug is taken, or the team is mid-migration to another region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMError"
        "413":
          description: The request body exceeds 32 KiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMError"
        "500":
          $ref: "#/components/responses/QMInternalError"
        "502":
          description: |
            The tenant was created but its model key could not be stored or the provisioning run could not be started. A definite failure leaves it in status `failed` with an event describing which; a run whose start could not be confirmed leaves it `provisioning` until it reports progress or goes stale and becomes retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMError"
  /v1/qm/tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/QMTenantID"
    get:
      operationId: getQMTenant
      tags:
        - qm
      summary: Get a tenant and its provisioning events
      security:
        - apiKey: []
      responses:
        "200":
          description: The tenant and its event log, oldest event first
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant
                  - events
                properties:
                  tenant:
                    $ref: "#/components/schemas/QMTenant"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/QMTenantEvent"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "404":
          $ref: "#/components/responses/QMNotFound"
        "500":
          $ref: "#/components/responses/QMInternalError"
    delete:
      operationId: deleteQMTenant
      tags:
        - qm
      summary: Delete a tenant
      description: |
        Moves a `ready` or `failed` tenant to `deprovisioning` and queues
        the teardown, which ends in status `deleted`. A tenant whose run is
        still in flight answers `409`; wait for it to settle first.
      security:
        - apiKey: []
      responses:
        "202":
          description: Teardown queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant
                properties:
                  tenant:
                    $ref: "#/components/schemas/QMTenant"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "403":
          $ref: "#/components/responses/QMForbidden"
        "404":
          $ref: "#/components/responses/QMNotFound"
        "409":
          $ref: "#/components/responses/QMConflict"
        "500":
          $ref: "#/components/responses/QMInternalError"
        "502":
          $ref: "#/components/responses/QMRunNotStarted"
  /v1/qm/tenants/{id}/admin-link:
    parameters:
      - $ref: "#/components/parameters/QMTenantID"
    post:
      operationId: mintQMAdminLink
      tags:
        - qm
      summary: Mint an admin sign-in link for the tenant's portal
      description: |
        Returns a single-use link, valid for five minutes, that signs the
        tenant's admin into its QM portal. The link is signed with the
        tenant's portal session secret, which is read from Secret Manager
        per request and never stored. This is a `POST` so that read-only
        (impersonation) keys cannot mint one. The tenant must be `ready`.
      security:
        - apiKey: []
      responses:
        "200":
          description: A fresh sign-in link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMAdminLink"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "403":
          $ref: "#/components/responses/QMForbidden"
        "404":
          $ref: "#/components/responses/QMNotFound"
        "409":
          $ref: "#/components/responses/QMConflict"
        "500":
          $ref: "#/components/responses/QMInternalError"
        "502":
          description: The tenant's portal session secret could not be read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QMError"
  /v1/qm/tenants/{id}/retry:
    parameters:
      - $ref: "#/components/parameters/QMTenantID"
    post:
      operationId: retryQMTenant
      tags:
        - qm
      summary: Retry a failed tenant
      description: |
        Re-queues the plan the tenant was last running (provision or
        deprovision). Every step is idempotent, so the run resumes from the
        step that failed. Only a `failed` tenant can be retried, and a
        tenant whose model key was never stored cannot be (`409`): the key
        is only supplied at create time, so delete it and create it again.
      security:
        - apiKey: []
      responses:
        "202":
          description: Run queued
          content:
            application/json:
              schema:
                type: object
                required:
                  - tenant
                properties:
                  tenant:
                    $ref: "#/components/schemas/QMTenant"
        "401":
          $ref: "#/components/responses/QMUnauthorized"
        "403":
          $ref: "#/components/responses/QMForbidden"
        "404":
          $ref: "#/components/responses/QMNotFound"
        "409":
          $ref: "#/components/responses/QMConflict"
        "500":
          $ref: "#/components/responses/QMInternalError"
        "502":
          $ref: "#/components/responses/QMRunNotStarted"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    QMAdminLink:
      type: object
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: Open in a browser; the signed token rides in the URL fragment.
        expiresAt:
          type: string
          format: date-time
    QMCreateTenantRequest:
      type: object
      required:
        - slug
        - orgName
        - adminEmail
        - signIn
        - modelProvider
        - modelKey
      properties:
        slug:
          type: string
          minLength: 3
          maxLength: 40
          pattern: ^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$
        orgName:
          type: string
          minLength: 1
          maxLength: 100
        adminEmail:
          type: string
          format: email
          description: The organization admin; admin sign-in links are minted for this address.
        signIn:
          type: string
          enum:
            - magic_link
            - slack
        modelProvider:
          type: string
          enum:
            - anthropic
            - openai
            - openrouter
        modelKey:
          type: string
          description: Provider API key. Stored in Secret Manager only; see the operation description.
        harness:
          type: string
          enum:
            - pi
            - claude
            - codex
            - opencode
          default: pi
    QMError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    QMFieldError:
      type: object
      required:
        - error
        - fields
      properties:
        error:
          type: string
        fields:
          type: object
          description: Field name to message for each invalid field.
          additionalProperties:
            type: string
    QMSlugAvailability:
      type: object
      required:
        - available
      properties:
        available:
          type: boolean
        reason:
          type: string
          description: Present when `available` is false.
    QMTenant:
      type: object
      required:
        - id
        - teamId
        - slug
        - orgName
        - adminEmail
        - signIn
        - modelProvider
        - harness
        - status
        - publicUrl
        - imageTag
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        teamId:
          type: string
          format: uuid
        slug:
          type: string
          description: DNS label; the tenant is served at `https://<slug>.<qm base domain>`.
        orgName:
          type: string
        adminEmail:
          type: string
          format: email
        signIn:
          type: string
          enum:
            - magic_link
            - slack
        modelProvider:
          type: string
          enum:
            - anthropic
            - openai
            - openrouter
        harness:
          type: string
          enum:
            - pi
            - claude
            - codex
            - opencode
        status:
          type: string
          enum:
            - provisioning
            - ready
            - failed
            - deprovisioning
            - deleted
        publicUrl:
          type:
            - string
            - "null"
          description: Set once the tenant's service is deployed.
        imageTag:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QMTenantEvent:
      type: object
      required:
        - id
        - step
        - status
        - message
        - detail
        - at
      properties:
        id:
          type: string
          format: uuid
        step:
          type: string
          description: |
            Provisioner step name, in plan order (`secrets`, `service_account`, `database`, `bucket`, `cloud_run`, `load_balancer`, `health_check`, `smoke`, `admin_link`), or `run` for the run as a whole, `model_key` and `trigger` for the API's own bookkeeping.
        status:
          type: string
          enum:
            - started
            - ok
            - failed
            - skipped
        message:
          type:
            - string
            - "null"
        detail:
          type:
            - object
            - "null"
          description: Step-specific data; anything secret-shaped is redacted before it is stored.
          additionalProperties: true
        at:
          type: string
          format: date-time
  parameters:
    QMTenantID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    QMConflict:
      description: The tenant's status does not allow this operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
    QMForbidden:
      description: |
        The key's holder lacks the team permission (`settings:read` for reads, `settings:write` for mutations), or the key is the console's impersonation key, which reads only with the `platform:qm:read` scope and never mutates
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
    QMInternalError:
      description: Unexpected failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
    QMNotFound:
      description: No such tenant in this team (deleted tenants are not found)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
    QMRunNotStarted:
      description: |
        The provisioner run could not be started. If the refusal was definite the tenant is marked `failed` and can be retried; if the start merely could not be confirmed it stays in flight until the run reports or goes stale.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
    QMUnauthorized:
      description: Invalid or missing X-API-Key header
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/QMError"
