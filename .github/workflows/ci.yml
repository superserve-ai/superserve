name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "guides/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"
  # No `branches` filter: a stacked PR targets its parent branch, not main, and
  # a filtered trigger would leave it with no lint, typecheck, test or build run
  # until it retargets. GitHub tests the merge of the PR into its own base, so a
  # stacked run covers the parent's changes too.
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "docs/**"
      - "guides/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - ".github/workflows/**"

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Check docs nav matches OpenAPI spec
        run: bun run docs:check-nav

      # Regenerates the console's hosted-QM types from the vendored /v1/qm/*
      # OpenAPI slice and fails on any diff. The qm-api spec change is not on
      # main yet, so the upstream spec is not reachable here and only the
      # committed slice is verified. Once it lands, check out the sandbox
      # repo's spec, point QM_OPENAPI_SPEC at it, and drop
      # QM_OPENAPI_ALLOW_MISSING_SPEC — the check fails while the switch is
      # set and the spec is reachable, so this cannot be left half-done.
      - name: Check QM types match the vendored qm-api OpenAPI slice
        env:
          QM_OPENAPI_ALLOW_MISSING_SPEC: "1"
        run: bun run qm:check-openapi

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
