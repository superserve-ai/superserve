name: Publish CLI

# cli-v* tags only (like mcp-v*/loops-v*): other packages release from this repo too.
# Release, binaries, npm, then the Homebrew tap; safe to re-run for the same tag.

on:
  push:
    tags: ["cli-v*"]

jobs:
  release:
    name: Build, release and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload binaries
      id-token: write # npm Trusted Publishing (OIDC) + provenance
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    env:
      SUPERSERVE_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm Trusted Publishing needs npm >= 11.5.1; Node 22 ships an older npm.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The version is bundled into the build, so set it first.
      - name: Set version from tag
        id: version
        working-directory: packages/cli
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#cli-v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Build
        run: |
          set -euo pipefail
          bunx turbo run build --filter=@superserve/sdk
          cd packages/cli && bun run build:binaries

      - name: Verify versions
        working-directory: packages/cli/dist
        run: |
          set -euo pipefail
          test "$(node index.js --version)" = "$VERSION"
          test "$(./superserve-bun-linux-x64 --version)" = "$VERSION"

      - name: Generate SHA256SUMS
        working-directory: packages/cli/dist
        run: sha256sum superserve-* > SHA256SUMS

      - name: Create release and upload binaries
        working-directory: packages/cli/dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Draft until every asset is up: install.sh picks the newest published
          # cli-v* release and must never see one without binaries.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --verify-tag --title "CLI $VERSION" --generate-notes
          gh release upload "$TAG" superserve-* SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false

      # dist/index.js bundles every runtime dependency; the workspace:* dev
      # dependencies mean nothing outside this repo.
      - name: Publish to npm (Trusted Publishing + provenance)
        working-directory: packages/cli
        run: |
          set -euo pipefail
          if npm view "@superserve/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@superserve/cli@$VERSION is already on npm; skipping publish"
            exit 0
          fi
          jq 'del(.devDependencies, .scripts)' package.json > package.json.tmp
          mv package.json.tmp package.json
          npm publish --access=public --provenance

  update-homebrew-tap:
    name: Update Homebrew formula
    needs: release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release.outputs.tag }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Render formula
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/SHA256SUMS "https://github.com/${{ github.repository }}/releases/download/${TAG}/SHA256SUMS"
          sha() { grep " superserve-bun-$1\$" /tmp/SHA256SUMS | awk '{print $1}'; }
          DARWIN_ARM64="$(sha darwin-arm64)"
          DARWIN_X64="$(sha darwin-x64)"
          LINUX_ARM64="$(sha linux-arm64)"
          LINUX_X64="$(sha linux-x64)"
          sed -e "s|__TAG__|${TAG}|g" \
              -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256_DARWIN_ARM64__|${DARWIN_ARM64}|g" \
              -e "s|__SHA256_DARWIN_X64__|${DARWIN_X64}|g" \
              -e "s|__SHA256_LINUX_ARM64__|${LINUX_ARM64}|g" \
              -e "s|__SHA256_LINUX_X64__|${LINUX_X64}|g" \
              packages/cli/Formula/superserve.rb > /tmp/superserve.rb

      - name: Push to tap repo
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/superserve-ai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp /tmp/superserve.rb tap/Formula/superserve.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/superserve.rb
          git diff --staged --quiet && echo "Formula unchanged, skipping." && exit 0
          git commit -m "superserve ${TAG}"
          git push
